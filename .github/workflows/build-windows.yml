name: Build Echo.exe

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.11.1

      - name: Empacotar Echo.exe
        run: pyinstaller --noconfirm --clean echo.spec

      - name: Conferir o binário
        shell: pwsh
        run: |
          if (-not (Test-Path dist/Echo.exe)) { throw "dist/Echo.exe não foi gerado" }
          Get-Item dist/Echo.exe | Select-Object Name, Length, LastWriteTime

      - uses: actions/upload-artifact@v4
        with:
          name: Echo-windows
          path: dist/Echo.exe
          if-no-files-found: error

      - name: Publicar release Echo.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view exe >/dev/null 2>&1 && gh release delete exe --yes || true
          git push origin :refs/tags/exe || true
          gh release create exe dist/Echo.exe \
            --title "Echo.exe" \
            --latest \
            --notes "$(cat <<'EOF'
          Baixe **Echo.exe** e dê dois cliques. Não precisa instalar Python.

          - Windows 10/11 64-bit
          - Primeira execução baixa o modelo Whisper (~150 MB). Depois fica offline.
          - Se o Windows pedir, instale o [Visual C++ Redistributable x64](https://aka.ms/vs/17/release/vc_redist.x64.exe).
          - O SmartScreen pode avisar (app sem certificado). *Mais informações → Executar mesmo assim*.

          Download direto: `https://github.com/MouraFelipe/audio-transcriber/releases/latest/download/Echo.exe`
          EOF
          )"
